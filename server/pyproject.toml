[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "hiredis>=3.4.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "msgpack>=1.2.3",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "scipy>=1.18.1",
    "simpy>=4.1.2",
    "slowapi>=0.1.10",
    "sortedcontainers>=2.4.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "sse-starlette>=3.5.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "httpx>=0.28.1",
    "hypothesis>=6.169.1",
    "locust>=2.46.7",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
